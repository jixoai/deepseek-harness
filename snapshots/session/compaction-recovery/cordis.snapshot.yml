# Keyless context-overflow replay composition.

- id: llm-deepseek
  name: '@fde2e/len-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@fde2e/len-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@fde2e/len-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@fde2e/len-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000

# Fixed-budget compaction scenario: keep the recorded tool set, whose token counts the thresholds were tuned to.
- id: tool-fs
  config:
    applyPatch: false
