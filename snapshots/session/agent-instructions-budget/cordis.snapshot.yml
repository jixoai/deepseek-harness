# Keyless headless replay uses the model script in this scenario's Session fixture.
- id: llm-deepseek
  name: '@fde2e/len-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@fde2e/len-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@fde2e/len-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@fde2e/len-agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .dsh-project

- id: system-prompt
  name: '@fde2e/len-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@fde2e/len-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
