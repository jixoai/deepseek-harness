# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-deepseek
  name: '@fde2e/len-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@fde2e/len-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- insert:
    - id: terminal
      name: '@fde2e/len-terminal'

- id: sandbox-policy
  name: '@fde2e/len-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@fde2e/len-subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@fde2e/len-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@fde2e/len-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@fde2e/len-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@fde2e/len-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@fde2e/len-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@fde2e/len-tool-jobs'
  disabled: true

- id: goal
  name: '@fde2e/len-goal'
  disabled: true

- id: goal-round-driver
  name: '@fde2e/len-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@fde2e/len-command-goal'
  disabled: true

- id: tool-goal
  name: '@fde2e/len-tool-goal'
  disabled: true

- id: skill
  name: '@fde2e/len-skill'
  disabled: true

- id: skill-filesystem
  name: '@fde2e/len-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@fde2e/len-tool-skill'
  disabled: true

- id: tool-bash
  name: '@fde2e/len-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@fde2e/len-tool-pwsh-persistent'
