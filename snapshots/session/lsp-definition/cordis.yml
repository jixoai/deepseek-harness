# Exercise the model-facing LSP tool through the shipped Loader entry path.
# The scenario workspace supplies the deterministic stdio server used by this test composition.
- insert:
    - id: lsp
      name: '@fde2e/len-lsp'
    - id: lsp-stdio
      name: '@fde2e/len-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@fde2e/len-tool-lsp'
      config:
        maxLocations: 1

- id: timeout-policy
  name: '@fde2e/len-tool-call-timeout-policy'
