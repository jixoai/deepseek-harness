# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@fde2e/len-system-prompt'

- id: fs
  name: '@fde2e/len-fs-local'

- id: session-projections
  name: '@fde2e/len-session-projection'

- id: working-directory
  name: '@fde2e/len-working-directory'

- id: tools
  name: '@fde2e/len-tools'

- id: tool-executor-native
  name: '@fde2e/len-tool-executor-native'

- id: subprocess
  name: '@fde2e/len-subprocess-local'

- id: bash
  name: '@fde2e/len-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@fde2e/len-shell-env'

- id: tasks
  name: '@fde2e/len-jobs-local'

- id: tool-jobs
  name: '@fde2e/len-tool-jobs'

- id: tool-pwsh
  name: '@fde2e/len-tool-pwsh'
