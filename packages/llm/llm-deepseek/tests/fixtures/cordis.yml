- name: '@fde2e/len-llm'
- name: '@fde2e/len-session'
- name: '@fde2e/len-session-projection'
- name: '@fde2e/len-system-prompt'
- name: '@fde2e/len-tools'
- name: '@fde2e/len-tool-executor-native'
- name: '@fde2e/len-agent'
- name: '@fde2e/len-agent-loop'
  config:
    agents: []
- name: '@fde2e/len-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@fde2e/len-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@fde2e/len-llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
